<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>A cheeky face made of Chinese tone marks</title>
  <rect width="64" height="64" rx="16" fill="#173d35"/>
  <g fill="none" stroke="#f5df91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- First tone fringe; rising and falling tone eyebrows. -->
    <path d="M26 12h12 M14 25l10-5 M40 20l10 5"/>
    <!-- The dipping third tone doubles as a mischievous smile. -->
    <path d="m22 43 10 9 11-12"/>
  </g>
  <g fill="#fff9e9">
    <circle cx="21" cy="32" r="3"/>
    <circle cx="43" cy="32" r="3"/>
  </g>
  <g fill="#e7977b">
    <ellipse cx="13" cy="40" rx="4" ry="2.5"/>
    <ellipse cx="51" cy="40" rx="4" ry="2.5"/>
  </g>
</svg>
